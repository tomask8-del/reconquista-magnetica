<meta charset="UTF-8" />
<title>Reconquista Magnética</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ============================================================
     CONFIGURAÇÃO RÁPIDA (o que você provavelmente vai querer editar
     está na seção CONFIG do <script>, lá embaixo)
     ============================================================ */

  :root{
    --ink:#000000;
    --ink-raised:#161616;
    --ink-raised-2:#202020;
    --paper:#ffffff;
    --text-body:#ececec;
    --muted:#cfcfcf;
    --muted-2:#9e9e9e;
    --ember:#ffd400;
    --ember-deep:#e0b400;
    --ember-soft:rgba(255,212,0,0.14);
    --on-ember:#000000;
    --wine:#c8425c;
    --wine-soft:rgba(200,66,92,0.18);
    --line:#2c2c2c;
    --danger:#ff6259;
    --good:#4fd17a;
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.8);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    --font-body: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    --font-mono: Helvetica, 'Helvetica Neue', Arial, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-body);
    line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; font-weight:700; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--ember); color:var(--on-ember);}
  a{color:var(--ember);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- shell ---------- */
  #qz-progress{
    position:fixed; top:0; left:0; right:0; height:3px; background:rgba(255,255,255,0.06); z-index:50;
  }
  #qz-progress-fill{
    height:100%; background:linear-gradient(90deg, var(--ember-deep), var(--ember)); width:0%;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }
  #app{
    max-width:600px; margin:0 auto; padding:56px 20px 80px;
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
  }
  #app.wide{ max-width:760px; }
  #app.top-align{ justify-content:flex-start; padding-top:28px; }
  .screen{ animation:rise .45s cubic-bezier(.16,1,.3,1); }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  .brand{
    display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:34px;
    font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  .brand .dot{width:6px; height:6px; border-radius:50%; background:var(--ember);}

  .eyebrow{
    font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:14.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ember); margin-bottom:14px; display:block; text-align:center;
  }
  .heading{ font-size:clamp(27px,4.6vw,37px); text-align:center; color:var(--paper); line-height:1.28; }
  .heading em{ font-style:normal; font-weight:800; color:var(--ember); }
  .hl{ background:var(--ember); color:var(--ink); padding:1px 7px; border-radius:5px; font-weight:800; white-space:nowrap; }
  .hl-para{ background:var(--ember); color:var(--ink); padding:2px 8px; border-radius:6px; font-weight:700; line-height:2; box-decoration-break:clone; -webkit-box-decoration-break:clone; }
  .sub{ text-align:center; color:var(--muted); margin-top:12px; font-size:18.5px; }

  /* ---------- options ---------- */
  .option-grid{ display:grid; gap:12px; margin-top:30px; }
  .option-grid.cols-2{ grid-template-columns:1fr 1fr; }
  .option{
    background:var(--ink-raised); border:1.5px solid var(--line); border-radius:var(--radius-md);
    padding:16px 18px; display:flex; align-items:center; gap:14px; text-align:left;
    color:var(--paper); font-size:19px; font-weight:500; transition:border-color .15s, background .15s, transform .1s;
  }
  @media (hover:hover) and (pointer:fine){ .option:hover{ border-color:var(--ember-deep); background:var(--ink-raised-2); } }
  .option:active{ transform:scale(.99); }
  .option.selected{ border-color:var(--ember); background:var(--ember-soft); }
  .option .emoji{ font-size:27px; line-height:1; flex-shrink:0; }
  .option .label{ flex:1; }
  .option .arrow{ color:var(--muted-2); font-size:22.5px; }
  .option .check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--muted-2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:16px; color:transparent;
  }
  .option.selected .check{ border-color:var(--ember); background:var(--ember); color:var(--on-ember); }

  .gender-grid{ display:grid; grid-template-columns:1fr; gap:14px; margin-top:30px; }
  .gender-card{
    background:var(--ink-raised); border:1.5px solid var(--line); border-radius:var(--radius-lg);
    padding:0 0 16px; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:10px;
    color:var(--paper); transition:border-color .15s, background .15s;
  }
  @media (hover:hover) and (pointer:fine){ .gender-card:hover{ border-color:var(--ember-deep); } }
  .gender-card img{ width:100%; aspect-ratio:21/9; object-fit:cover; object-position:top; display:block; }
  .gender-card .label-row{ display:flex; align-items:center; justify-content:center; gap:9px; }
  .gender-card .radio-ind{ width:15px; height:15px; border-radius:50%; border:2px solid var(--ember); flex-shrink:0; }
  .gender-card .label{ font-weight:600; font-size:18.5px; }

  .warn-box{
    margin-top:34px; background:var(--wine-soft); border:1px solid rgba(168,59,82,0.4);
    border-radius:var(--radius-md); padding:14px 16px; display:flex; gap:10px; align-items:flex-start;
  }
  .warn-box .tag{
    font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13.5px; letter-spacing:.1em; text-transform:uppercase;
    background:var(--wine); color:#fff; padding:2px 8px; border-radius:5px; flex-shrink:0; margin-top:2px;
  }
  .warn-box p{ font-size:17px; color:var(--paper); line-height:1.5; }

  /* ---------- scale ---------- */
  .scale-row{ display:flex; gap:10px; margin-top:32px; justify-content:center; }
  .scale-btn{
    width:56px; height:56px; border-radius:50%; border:1.5px solid var(--line); background:var(--ink-raised);
    color:var(--paper); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:22.5px; font-weight:600;
  }
  @media (hover:hover) and (pointer:fine){ .scale-btn:hover{ border-color:var(--ember-deep); } }
  .scale-gradient{ height:6px; border-radius:99px; margin-top:18px; background:linear-gradient(90deg, var(--danger), var(--ember), var(--good)); }
  .scale-labels{ display:flex; justify-content:space-between; margin-top:10px; font-size:15.5px; color:var(--muted); }

  /* ---------- continue button ---------- */
  .btn-continue{
    margin-top:26px; width:100%; padding:16px; border-radius:999px; border:none;
    background:linear-gradient(180deg, var(--ember), var(--ember-deep)); color:var(--on-ember); font-weight:700;
    font-size:19.5px; box-shadow:0 12px 30px -12px rgba(232,181,75,0.55); transition:transform .1s, opacity .15s;
  }
  .btn-continue:active{ transform:scale(.98); }
  .btn-continue:disabled{ opacity:.35; box-shadow:none; }
  .btn-continue.btn-green{
    background:linear-gradient(180deg, #2ecc71, #1e9e56); color:#ffffff;
    box-shadow:0 12px 30px -12px rgba(46,204,113,0.55);
  }
  .btn-ghost-note{ text-align:center; font-size:14.5px; color:var(--muted-2); margin-top:10px; }

  /* ---------- interstitial ---------- */
  .interstitial p{ color:var(--text-body); font-size:19px; margin-top:16px; line-height:1.65; text-align:center; }
  .interstitial p.p-alert-red{ font-size:26px; font-weight:800; color:#ff4d4d; line-height:1.3; }
  .interstitial p.p-alert{ font-size:23px; font-weight:700; line-height:1.3; }
  .redbold{ color:#ff4d4d; font-weight:800; }
  .interstitial-media{ display:flex; justify-content:center; gap:28px; margin-top:22px; }
  .interstitial-media .im-item{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .interstitial-media .im-item svg{ width:52px; height:52px; }
  .interstitial-media .im-item span{ font-size:12.5px; color:var(--muted); text-align:center; max-width:110px; }
  .interstitial-media.single{ margin-top:20px; margin-bottom:6px; }
  .interstitial-media.single .im-item svg{ width:64px; height:64px; }
  .interstitial-media .im-item img{ width:70%; max-width:260px; aspect-ratio:1/1; border-radius:0; object-fit:cover; }

  /* ---------- interstitial compact variant (short viewports, no scroll) ---------- */
  #app.compact-app{ padding-top:24px; padding-bottom:24px; }
  .interstitial.compact{
    display:flex; flex-direction:column; min-height:calc(100vh - 48px);
    justify-content:space-between; gap:14px;
  }
  .interstitial.compact .heading{ font-size:22.5px; margin-top:0; }
  .interstitial.compact p{ margin-top:0; font-size:18px; line-height:1.5; }
  .interstitial.compact .hl-para{ line-height:1.4; padding:1px 7px; }
  .interstitial.compact .interstitial-media{ margin-top:0; }
  .interstitial.compact .interstitial-media.single{ margin-top:0; margin-bottom:0; }
  .interstitial.compact .btn-continue{ margin-top:0; }
  @media (max-width:340px){ .interstitial.compact .heading{ font-size:19.5px; } }
  @media (max-height:760px){
    .interstitial.compact{ gap:10px; }
    .interstitial.compact p{ font-size:17px; line-height:1.42; }
    .interstitial.compact .interstitial-media .im-item img{ max-width:220px !important; }
  }
  @media (max-height:620px){
    .interstitial.compact{ gap:7px; }
    .interstitial.compact .heading{ font-size:19px; }
    .interstitial.compact p{ font-size:15.5px; line-height:1.36; }
    .interstitial.compact .interstitial-media .im-item img{ max-width:150px !important; }
  }

  /* ---------- loading ---------- */
  .loading-wrap{ text-align:center; }
  .ring{ width:110px; height:110px; margin:0 auto 30px; position:relative; }
  .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle{ fill:none; stroke-width:6; }
  .ring .track{ stroke:var(--line); }
  .ring .fill{ stroke:var(--ember); stroke-linecap:round; transition:stroke-dashoffset .1s linear; }
  .ring .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:27px; font-weight:600;
  }
  .loading-lines{ margin-top:8px; text-align:left; }
  .loading-line{ margin-bottom:16px; }
  .loading-line .row{ display:flex; justify-content:space-between; font-size:16px; color:var(--muted); margin-bottom:6px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .bar-track{ height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--ember-deep),var(--ember)); width:0%; transition:width .25s linear; }

  /* ---------- thank you / expert ---------- */
  .expert-avatar{
    width:100%; max-width:260px; aspect-ratio:2/3; margin:0 auto 22px; background:var(--ink-raised-2);
    border:2px solid var(--ember); border-radius:16px; overflow:hidden;
  }
  .expert-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .quote-block{
    margin-top:22px; padding-left:16px; border-left:2px solid var(--ember);
  }
  .quote-block p{ color:var(--text-body); font-size:18.5px; margin-bottom:12px; line-height:1.6; }
  .quote-block p.p-red{ color:#ff4d4d; }

  /* ---------- testimonials ---------- */
  .testimonials-wrap.compact{
    display:flex; flex-direction:column; min-height:calc(100vh - 48px);
    justify-content:space-between; gap:12px;
  }
  .stat-hero{ text-align:center; margin-bottom:8px; }
  .stat-hero .num{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:64px; color:var(--ember); font-weight:600; }
  .stat-hero .cap{ color:var(--muted); font-size:17.5px; max-width:340px; margin:6px auto 0; }
  .testimonials-wrap.compact .stat-hero{ margin-bottom:0; }
  .testimonials-wrap.compact .stat-hero .num{ font-size:46px; }
  .testimonials-wrap.compact .stat-hero .cap{ font-size:15.5px; margin-top:2px; }
  .testi-cards{ display:flex; flex-direction:column; gap:14px; }
  .testi-card{
    background:var(--ink-raised); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:18px; margin-top:16px;
  }
  .testi-cards .testi-card{ margin-top:0; }
  .testi-card .who{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .testi-card .avatar{
    width:36px; height:36px; border-radius:50%; background:var(--ink-raised-2); display:flex;
    align-items:center; justify-content:center; font-size:18.5px; border:1px solid var(--line); flex-shrink:0;
  }
  .testi-card .avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .testi-card .name{ font-weight:600; font-size:17.5px; }
  .testi-card .meta{ font-size:14.5px; color:var(--muted-2); }
  .testi-card .quote{ font-size:17.5px; color:var(--text-body); line-height:1.55; }
  .testi-card.placeholder{ border-style:dashed; border-color:var(--muted-2); }
  .testimonials-wrap.compact .testi-card{ padding:13px 15px; }
  .testimonials-wrap.compact .testi-card .who{ margin-bottom:6px; }
  .testimonials-wrap.compact .testi-card .avatar{ width:30px; height:30px; }
  .testimonials-wrap.compact .testi-card .name{ font-size:15.5px; }
  .testimonials-wrap.compact .testi-card .meta{ font-size:13px; }
  .testimonials-wrap.compact .testi-card .quote{ font-size:14.5px; line-height:1.4; }
  .testimonials-wrap.compact .btn-continue{ margin-top:0; }
  @media (max-height:800px){
    .testimonials-wrap.compact .stat-hero .num{ font-size:38px; }
    .testimonials-wrap.compact .testi-card{ padding:11px 13px; }
    .testimonials-wrap.compact .testi-card .quote{ font-size:13.5px; line-height:1.34; }
  }
  @media (max-height:680px){
    .testimonials-wrap.compact{ gap:8px; }
    .testi-cards{ gap:8px; }
    .testimonials-wrap.compact .stat-hero .num{ font-size:32px; }
    .testimonials-wrap.compact .stat-hero .cap{ font-size:14px; }
    .testimonials-wrap.compact .testi-card{ padding:9px 12px; }
    .testimonials-wrap.compact .testi-card .avatar{ width:26px; height:26px; }
    .testimonials-wrap.compact .testi-card .who{ margin-bottom:4px; }
    .testimonials-wrap.compact .testi-card .quote{ font-size:12.5px; line-height:1.3; }
  }
  @media (max-height:600px){
    .testimonials-wrap.compact{ gap:5px; }
    .testi-cards{ gap:5px; }
    .testimonials-wrap.compact .stat-hero .num{ font-size:26px; }
    .testimonials-wrap.compact .stat-hero .cap{ font-size:12.5px; }
    .testimonials-wrap.compact .testi-card{ padding:7px 10px; }
    .testimonials-wrap.compact .testi-card .avatar{ width:22px; height:22px; }
    .testimonials-wrap.compact .testi-card .name{ font-size:13px; }
    .testimonials-wrap.compact .testi-card .meta{ font-size:11px; }
    .testimonials-wrap.compact .testi-card .quote{ font-size:11px; line-height:1.24; }
  }
  .testi-card.placeholder .quote{ color:var(--muted); }

  /* ---------- timeline (final-step) ---------- */
  .timeline{ display:flex; justify-content:space-between; margin-top:36px; position:relative; }
  .timeline::before{
    content:''; position:absolute; top:9px; left:20px; right:20px; height:2px;
    background:linear-gradient(90deg, var(--line), var(--ember));
  }
  .tl-step{ position:relative; text-align:center; flex:1; }
  .tl-dot{
    width:20px; height:20px; border-radius:50%; background:var(--ink-raised); border:2px solid var(--line);
    margin:0 auto 10px; position:relative; z-index:2;
  }
  .tl-step:last-child .tl-dot{ background:var(--ember); border-color:var(--ember); }
  .tl-step .tl-when{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ember); }
  .tl-step .tl-what{ font-size:14px; color:var(--muted); margin-top:4px; line-height:1.35; }

  .checklist{ list-style:none; padding:0; margin:32px 0 0; display:flex; flex-direction:column; gap:12px; }
  .checklist li{ display:flex; gap:10px; font-size:18px; color:var(--text-body); line-height:1.5; }
  .checklist li .ck{ color:var(--ember); flex-shrink:0; }

  /* ---------- final step (21-day plan) ---------- */
  .grafico-img{ width:100%; border-radius:var(--radius-md); margin-top:30px; display:block; }
  .fs-sub{ font-size:21px; margin-top:30px; }
  .fs-sub2{ font-size:21.5px; margin-top:34px; }
  .finalstep-wrap.compact{
    display:flex; flex-direction:column; min-height:calc(100vh - 48px);
    justify-content:space-between; gap:10px;
  }
  .finalstep-wrap.compact .heading{ margin-top:0; }
  .finalstep-wrap.compact .grafico-img{ margin-top:0; max-height:170px; object-fit:contain; }
  .finalstep-wrap.compact .fs-sub{ margin-top:0; font-size:18.5px; }
  .finalstep-wrap.compact .fs-sub2{ margin-top:0; font-size:19px; }
  .finalstep-wrap.compact .checklist{ margin-top:0; gap:8px; }
  .finalstep-wrap.compact .checklist li{ font-size:15.5px; line-height:1.36; }
  .finalstep-wrap.compact .btn-continue{ margin-top:0; }
  @media (max-height:800px){
    .finalstep-wrap.compact .grafico-img{ max-height:130px; }
    .finalstep-wrap.compact .checklist li{ font-size:14.5px; line-height:1.3; }
    .finalstep-wrap.compact .fs-sub, .finalstep-wrap.compact .fs-sub2{ font-size:17.5px; }
  }
  @media (max-height:680px){
    .finalstep-wrap.compact{ gap:6px; }
    .finalstep-wrap.compact .grafico-img{ max-height:100px; }
    .finalstep-wrap.compact .checklist{ gap:5px; }
    .finalstep-wrap.compact .checklist li{ font-size:13px; line-height:1.26; }
    .finalstep-wrap.compact .fs-sub, .finalstep-wrap.compact .fs-sub2{ font-size:16px; }
    .finalstep-wrap.compact .heading{ font-size:22px; }
  }
  @media (max-height:600px){
    .finalstep-wrap.compact .grafico-img{ max-height:76px; }
    .finalstep-wrap.compact .checklist li{ font-size:11.5px; line-height:1.22; }
    .finalstep-wrap.compact .fs-sub, .finalstep-wrap.compact .fs-sub2{ font-size:14.5px; }
    .finalstep-wrap.compact .heading{ font-size:19.5px; }
  }

  /* ============================================================
     LANDING (página de oferta final)
     ============================================================ */
  .lp-section{ padding:44px 22px; max-width:720px; margin:0 auto; }
  .lp-section.tight{ padding-top:20px; padding-bottom:20px; }
  .countdown-bar{
    position:sticky; top:0; z-index:40; background:var(--wine); color:#fff;
    padding:10px 14px; font-size:15.5px; font-weight:600; display:flex; gap:10px; justify-content:space-between; align-items:center;
  }
  .countdown-bar .cd-text{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .countdown-bar .clock{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; background:rgba(0,0,0,0.25); padding:2px 8px; border-radius:6px; flex-shrink:0; }
  .countdown-bar .cd-cta{
    flex-shrink:0; border:none; background:var(--good); color:#04220f; font-weight:700; font-size:14px;
    letter-spacing:.02em; text-transform:uppercase; padding:8px 12px; border-radius:999px; text-decoration:none; white-space:nowrap;
  }
  .lp-hero{ text-align:center; padding:40px 22px 10px; }
  .lp-hero .heading{ font-size:clamp(32px,5.5vw,44px); }

  .compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:30px; }
  .compare-card{ border-radius:var(--radius-md); padding:18px; border:1px solid var(--line); }
  .compare-card.now{ background:var(--wine-soft); }
  .compare-card.goal{ background:var(--ember-soft); }
  .compare-card .cc-label{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:8px; }
  .compare-card .cc-emoji{ font-size:32px; }
  .compare-card .cc-title{ font-weight:600; margin-top:6px; font-size:18px; }
  .compare-card .cc-sub{ font-size:15.5px; color:var(--muted); margin-top:2px; }
  .cc-bar-track{ height:6px; background:rgba(255,255,255,0.08); border-radius:99px; overflow:hidden; margin:10px 0; }
  .cc-bar-fill{ height:100%; border-radius:99px; }
  .cc-bar-fill.now{ width:82%; background:var(--danger); }
  .cc-bar-fill.goal{ width:18%; background:var(--good); }
  .cc-bar-fill.prob{ background:linear-gradient(90deg, var(--ember-deep), var(--ember)); }
  .prob-label{ font-weight:600; font-size:18px; margin-bottom:2px; }

  .prob-card{
    margin-top:20px; background:var(--ink-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:22px; display:flex; align-items:flex-start; gap:18px;

:'', imgStyle:'width:100%;max-width:300px;aspect-ratio:1/1;border-radius:14px;object-fit:cover;' },

    { type:'loading' },
    { type:'thankyou' },
    { type:'testimonials', topAlign:true, compact:true },
    { type:'scale', key:'comprometimento', q:'De 1 a 4, o quanto você está disposto a se dedicar a esse processo?',
      left:'Ainda em dúvida', right:'Estou decidido(a)',
      note:'Esse método funciona melhor pra quem está realmente comprometido em seguir os passos, não pra quem busca atalho.' },
    { type:'progress' },

    { type:'landing' }
  ];

  const TOTAL_PROGRESS_STEPS = FLOW.findIndex(s=>s.type==='loading'); // barra de progresso só durante o quiz

  /* ============================================================
     RENDER ENGINE
     ============================================================ */
  const app = document.getElementById('app');
  const progressFill = document.getElementById('qz-progress-fill');
  const progressWrap = document.getElementById('qz-progress');

  function goNext(){ state.i++; render(); window.scrollTo({top:0, behavior:'smooth'}); }

  function updateProgress(){
    if(state.i >= TOTAL_PROGRESS_STEPS){ progressWrap.style.opacity = '0'; return; }
    progressWrap.style.opacity = '1';
    const pct = Math.min(100, Math.round((state.i / TOTAL_PROGRESS_STEPS) * 100));
    progressFill.style.width = pct + '%';
  }

  function brandHtml(){
    return `<div class="brand"><span class="dot"></span>${CONFIG.productName}</div>`;
  }

  function render(){
    const step = FLOW[state.i];
    updateProgress();
    app.className = (step.type === 'landing') ? 'wide' : [step.topAlign ? 'top-align' : '', step.compact ? 'compact-app' : ''].filter(Boolean).join(' ');
    app.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'screen';
    app.appendChild(wrap);

    const renderers = {
      intro: renderIntro, single: renderSingle, multi: renderMulti, scale: renderScale,
      interstitial: renderInterstitial, loading: renderLoading, thankyou: renderThankyou,
      testimonials: renderTestimonials, progress: renderProgressLoading,
      finalstep: renderFinalStep, landing: renderLanding
    };
    renderers[step.type](wrap, step);
  }

  function renderIntro(wrap){
    wrap.innerHTML = `
      <h1 class="heading">Não deixe quem você ama <em>sair da sua vida</em> de vez.</h1>
      <p class="sub">Descubra seu plano de reaproximação<br>em 1 minuto:</p>
      <h3 class="heading" style="font-size:21.5px;margin-top:34px;"><span class="hl">Qual é seu gênero?</span></h3>
      <div class="gender-grid">
        <button class="gender-card" data-g="m">${male_avatar}<span class="label-row"><span class="radio-ind"></span><span class="label">Masculino</span></span></button>
        <button class="gender-card" data-g="f">${female_avatar}<span class="label-row"><span class="radio-ind"></span><span class="label">Feminino</span></span></button>
      </div>
      <div class="warn-box">
        <span class="tag">Aviso</span>
        <p>Continue só se você realmente quer essa pessoa de volta na sua vida. As próximas perguntas vão direto ao ponto.</p>
      </div>
    `;
    wrap.querySelectorAll('.gender-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.genderKey = btn.dataset.g; goNext(); });
    });
  }

  function questionHeader(step){
    return `<h2 class="heading">${t(step.q)}</h2>${step.sub ? `<p class="sub">${step.sub}</p>` : ''}`;
  }

  function renderSingle(wrap, step){
    const opts = step.options.map(o => typeof o === 'string' ? {l:o} : o);
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="option-grid">
        ${opts.map((o,idx)=>`
          <button class="option" data-idx="${idx}">
            ${o.e ? `<span class="emoji">${o.e}</span>` : ''}
            <span class="label">${t(o.l)}</span>
            ${step.arrow ? '<span class="arrow">›</span>' : ''}
          </button>`).join('')}
      </div>
    `;
    wrap.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.answers[step.key] = opts[btn.dataset.idx].l;
        goNext();
      });
    });
  }

  function renderMulti(wrap, step){
    const opts = step.options.map(o => typeof o === 'string' ? {l:o} : o);
    const selected = new Set();
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="option-grid">
        ${opts.map((o,idx)=>`
          <button class="option" data-idx="${idx}">
            ${o.e ? `<span class="emoji">${o.e}</span>` : ''}
            <span class="label">${t(o.l)}</span>
            <span class="check">✓</span>
          </button>`).join('')}
      </div>
      <button class="btn-continue" disabled>Continuar</button>
    `;
    const cont = wrap.querySelector('.btn-continue');
    wrap.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.idx;
        if(selected.has(idx)){ selected.delete(idx); btn.classList.remove('selected'); }
        else{ selected.add(idx); btn.classList.add('selected'); }
        cont.disabled = selected.size === 0;
      });
    });
    cont.addEventListener('click', ()=>{
      state.answers[step.key] = Array.from(selected).map(i=>opts[i].l);
      goNext();
    });
  }

  function renderScale(wrap, step){
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="scale-row">
        ${[1,2,3,4].map(n=>`<button class="scale-btn" data-n="${n}">${n}</button>`).join('')}
      </div>
      <div class="scale-gradient"></div>
      <div class="scale-labels"><span>${t(step.left)}</span><span>${t(step.right)}</span></div>
      ${step.note ? `<p class="sub" style="margin-top:22px;">${step.note}</p>` : ''}
    `;
    wrap.querySelectorAll('.scale-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.answers[step.key] = btn.dataset.n; goNext(); });
    });
  }

  function renderInterstitial(wrap, step){
    let contentHtml, mediaHtml = '', restHtml = '';
    if(step.blocks){
      const renderBlock = b=>{
        if(b.type === 'media'){
          const visual = b.img ? `<img src="${b.img}" alt="${t(b.label)}"${b.imgStyle ? ` style="${b.imgStyle}"` : ''}>` : icon(b.icon);
          return `<div class="interstitial-media single"><div class="im-item">${visual}<span>${t(b.label)}</span></div></div>`;
        }
        if(b.hl) return `<p><span class="hl-para">${t(b.text)}</span></p>`;
        return `<p${b.cls ? ` class="${b.cls}"` : ''}>${t(b.text)}</p>`;
      };
      mediaHtml = step.blocks.filter(b=>b.type==='media').map(renderBlock).join('');
      restHtml = step.blocks.filter(b=>b.type!=='media').map(renderBlock).join('');
      contentHtml = mediaHtml + restHtml;
    } else {
      mediaHtml = step.media ? `
        <div class="interstitial-media">
          ${step.media.map(m=>`<div class="im-item">${icon(m.icon)}<span>${t(m.label)}</span></div>`).join('')}
        </div>` : '';
      restHtml = step.body.map(p=>`<p>${t(p)}</p>`).join('');
      contentHtml = mediaHtml + restHtml;
    }
    const titleHtml = step.title ? `<h2 class="heading">${t(step.title)}</h2>` : '';
    const bodyHtml = step.titleAfterMedia ? (mediaHtml + titleHtml + restHtml) : (titleHtml + contentHtml);
    wrap.innerHTML = `
      <div class="interstitial${step.compact ? ' compact' : ''}">
        ${step.noEyebrow ? '' : `<span class="eyebrow">${CONFIG.productName}</span>`}
        ${bodyHtml}
        <button class="btn-continue">Continuar</button>
      </div>
    `;
    wrap.querySelector('.btn-continue').addEventListener('click', goNext);
  }

  function renderLoading(wrap){
    wrap.innerHTML = `
      <div class="loading-wrap">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="fill" id="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"></circle>
          </svg>
          <div class="pct" id="ring-pct">0%</div>
        </div>
        <h2 class="heading" style="font-size:23.5px;">Analisando suas respostas...</h2>
        <p class="sub">Estamos montando o seu diagnóstico personalizado.</p>
      </div>
    `;
    const fill = wrap.querySelector('#ring-fill');
    const pctEl = wrap.querySelector('#ring-pct');
    let pct = 0;
    const timer = setInterval(()=>{
      pct += Math.random()*14 + 6;
      if(pct >= 100){ pct = 100; clearInterval(timer); setTimeout(goNext, 450); }
      fill.style.strokeDashoffset = String(327 - (327*pct/100));
      pctEl.textContent = Math.round(pct) + '%';
    }, 260);
  }

    });

  function computeProbability(){
    let score = 78;
    const a = state.answers;
    if(a.situacao === 'Conversamos de vez em quando' || a.situacao === 'Viramos amigos') score += 8;
    if(a.situacao === '{Ex} me bloqueou') score -= 6;
    if(a.novo_alguem === 'Não, não está') score += 6;
    if(a.comprometimento === '4') score += 5;
    if(a.comprometimento === '1') score -= 8;
    return Math.max(74, Math.min(96, score));
  }

    wrap.querySelectorAll('h1, .cc-sub, .urgency-line, .btn-buy').forEach(el=> el.innerHTML = t(el.innerHTML));

    // countdown
    let secondsLeft = CONFIG.countdownMinutes * 60;
    const cdEl = wrap.querySelector('#cd');
    const cdTimer = setInterval(()=>{
      secondsLeft--;
      if(secondsLeft <= 0){ secondsLeft = CONFIG.countdownMinutes * 60; }
      const m = String(Math.floor(secondsLeft/60)).padStart(2,'0');
      const s = String(secondsLeft%60).padStart(2,'0');
      if(cdEl) cdEl.textContent = `${m}:${s}`; else clearInterval(cdTimer);
    }, 1000);

    // faq accordion
    wrap.querySelectorAll('.faq-item').forEach(item=>{
      item.querySelector('.q').addEventListener('click', ()=>{
        const isOpen = item.classList.contains('open');
        wrap.querySelectorAll('.faq-item').forEach(i=>{ i.classList.remove('open'); i.querySelector('.a').style.maxHeight = null; });
        if(!isOpen){ item.classList.add('open'); const a = item.querySelector('.a'); a.style.maxHeight = a.scrollHeight + 'px'; }
      });
    });
  }

  render();
})();
</script>
