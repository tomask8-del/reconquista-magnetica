<script>
(function(){

  /* ============================================================
     CONFIG: edite aqui com os dados do SEU infoproduto
     ============================================================ */
  const CONFIG = {
    productName:   "Reconquista Magnética",  // nome do infoproduto
    expertName:    "Henri Pesce",
    expertBio:     "Depois de anos estudando psicologia de relacionamentos, criei um passo a passo simples pra ajudar pessoas a reconstruírem uma conexão que parecia perdida, sem jogos mentais e sem se humilhar.",
    priceOld:      "94",
    priceNew:      "47",
    currency:      "R$",
    checkoutUrl:   "https://SEU-LINK-DE-CHECKOUT.com", // TODO: cole aqui o link de vendas/checkout
    countdownMinutes: 10
  };

  // troque "ela"/"ele" caso queira, ou deixe assim: o quiz pergunta o gênero
  // e usa esses tokens pra montar as frases sobre a pessoa que o usuário
  // quer reconquistar.
  const PRONOUNS = {
    m: { ex:'ela', Ex:'Ela', o:'a', O:'A', a:'a', traida:'traída', obcecada:'obcecada', motivada:'motivada', suaex:'sua ex', deex:'dela' },
    f: { ex:'ele', Ex:'Ele', o:'o', O:'O', a:'o', traida:'traído', obcecada:'obcecado', motivada:'motivado', suaex:'seu ex', deex:'dele' }
  };

  let state = { genderKey:'m', answers:{}, i:0 };

  function t(str){
    const p = PRONOUNS[state.genderKey];
    return str.replace(/\{(\w+)\}/g, (_,k)=> (k in p ? p[k] : ''));
  }

  function icon(name){

      title:'{Ex} também sente falta, mesmo que não demonstre',

        'É raro alguém admitir isso logo de cara. Mas os sinais de que uma conexão antiga ainda pulsa costumam aparecer nos detalhes: numa mensagem vista sem resposta, num story assistido, numa lembrança comentada do nada.',
        'Memória afetiva e atração física não desaparecem só porque duas pessoas pararam de se falar. Elas ficam guardadas, e voltam à tona quando alguém sabe como reabrir esse espaço com naturalidade.',
        'O plano que preparamos te mostra exatamente como interpretar esses sinais e o que fazer com cada um deles, na ordem certa.'
      ] },
    { type:'loading' },
    { type:'thankyou' },
    { type:'testimonials' },
    { type:'scale', key:'comprometimento', q:'De 1 a 4, o quanto você está disposto a se dedicar a esse processo?',
      left:'Ainda em dúvida', right:'Estou decidido(a)',
      note:'Esse método funciona melhor pra quem está realmente comprometido em seguir os passos, não pra quem busca atalho.' },
    { type:'progress' },
    { type:'finalstep' },
    { type:'landing' }
  ];

  const TOTAL_PROGRESS_STEPS = FLOW.findIndex(s=>s.type==='loading'); // barra de progresso só durante o quiz

  /* ============================================================
     RENDER ENGINE
     ============================================================ */
  const app = document.getElementById('app');
  const progressFill = document.getElementById('qz-progress-fill');
  const progressWrap = document.getElementById('qz-progress');

  function goNext(){ state.i++; render(); window.scrollTo({top:0, behavior:'smooth'}); }

  function updateProgress(){
    if(state.i >= TOTAL_PROGRESS_STEPS){ progressWrap.style.opacity = '0'; return; }
    progressWrap.style.opacity = '1';
    const pct = Math.min(100, Math.round((state.i / TOTAL_PROGRESS_STEPS) * 100));
    progressFill.style.width = pct + '%';
  }

  function brandHtml(){
    return `<div class="brand"><span class="dot"></span>${CONFIG.productName}</div>`;
  }

  function render(){
    const step = FLOW[state.i];
    updateProgress();
    app.className = (step.type === 'landing') ? 'wide' : '';
    app.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'screen';
    app.appendChild(wrap);

    const renderers = {
      intro: renderIntro, single: renderSingle, multi: renderMulti, scale: renderScale,
      interstitial: renderInterstitial, loading: renderLoading, thankyou: renderThankyou,
      testimonials: renderTestimonials, progress: renderProgressLoading,
      finalstep: renderFinalStep, landing: renderLanding
    };
    renderers[step.type](wrap, step);
  }

  function renderIntro(wrap){
    wrap.innerHTML = `
      <h1 class="heading">Não deixe quem você ama <em>sair da sua vida</em> de vez.</h1>
      <p class="sub">Descubra seu plano de reaproximação<br>em 1 minuto:</p>
      <h3 class="heading" style="font-size:21.5px;margin-top:34px;">Pra começar, qual é o seu gênero?</h3>
      <div class="gender-grid">
        <button class="gender-card" data-g="m">${male_avatar}<span class="label-row"><span class="radio-ind"></span><span class="label">Masculino</span></span></button>
        <button class="gender-card" data-g="f">${female_avatar}<span class="label-row"><span class="radio-ind"></span><span class="label">Feminino</span></span></button>
      </div>
      <div class="warn-box">
        <span class="tag">Aviso</span>
        <p>Continue só se você realmente quer essa pessoa de volta na sua vida. As próximas perguntas vão direto ao ponto.</p>
      </div>
    `;
    wrap.querySelectorAll('.gender-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.genderKey = btn.dataset.g; goNext(); });
    });
  }

  function questionHeader(step){
    return `<h2 class="heading">${t(step.q)}</h2>${step.sub ? `<p class="sub">${step.sub}</p>` : ''}`;
  }

  function renderSingle(wrap, step){
    const opts = step.options.map(o => typeof o === 'string' ? {l:o} : o);
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="option-grid">
        ${opts.map((o,idx)=>`
          <button class="option" data-idx="${idx}">
            ${o.e ? `<span class="emoji">${o.e}</span>` : ''}
            <span class="label">${t(o.l)}</span>
            ${step.arrow ? '<span class="arrow">›</span>' : ''}
          </button>`).join('')}
      </div>
    `;
    wrap.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.answers[step.key] = opts[btn.dataset.idx].l;
        goNext();
      });
    });
  }

  function renderMulti(wrap, step){
    const opts = step.options.map(o => typeof o === 'string' ? {l:o} : o);
    const selected = new Set();
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="option-grid">
        ${opts.map((o,idx)=>`
          <button class="option" data-idx="${idx}">
            ${o.e ? `<span class="emoji">${o.e}</span>` : ''}
            <span class="label">${t(o.l)}</span>
            <span class="check">✓</span>
          </button>`).join('')}
      </div>
      <button class="btn-continue" disabled>Continuar</button>
    `;
    const cont = wrap.querySelector('.btn-continue');
    wrap.querySelectorAll('.option').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.idx;
        if(selected.has(idx)){ selected.delete(idx); btn.classList.remove('selected'); }
        else{ selected.add(idx); btn.classList.add('selected'); }
        cont.disabled = selected.size === 0;
      });
    });
    cont.addEventListener('click', ()=>{
      state.answers[step.key] = Array.from(selected).map(i=>opts[i].l);
      goNext();
    });
  }

  function renderScale(wrap, step){
    wrap.innerHTML = `
      ${questionHeader(step)}
      <div class="scale-row">
        ${[1,2,3,4].map(n=>`<button class="scale-btn" data-n="${n}">${n}</button>`).join('')}
      </div>
      <div class="scale-gradient"></div>
      <div class="scale-labels"><span>${t(step.left)}</span><span>${t(step.right)}</span></div>
      ${step.note ? `<p class="sub" style="margin-top:22px;">${step.note}</p>` : ''}
    `;
    wrap.querySelectorAll('.scale-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{ state.answers[step.key] = btn.dataset.n; goNext(); });
    });
  }

  function renderInterstitial(wrap, step){
    let contentHtml;
    if(step.blocks){
      contentHtml = step.blocks.map(b=>{
        if(b.type === 'media'){
          const visual = b.img ? `<img src="${b.img}" alt="${t(b.label)}">` : icon(b.icon);
          return `<div class="interstitial-media single"><div class="im-item">${visual}<span>${t(b.label)}</span></div></div>`;
        }
        return b.hl ? `<p><span class="hl-para">${t(b.text)}</span></p>` : `<p>${t(b.text)}</p>`;
      }).join('');
    } else {
      const mediaHtml = step.media ? `
        <div class="interstitial-media">
          ${step.media.map(m=>`<div class="im-item">${icon(m.icon)}<span>${t(m.label)}</span></div>`).join('')}
        </div>` : '';
      contentHtml = mediaHtml + step.body.map(p=>`<p>${t(p)}</p>`).join('');
    }
    wrap.innerHTML = `
      <div class="interstitial">
        ${step.noEyebrow ? '' : `<span class="eyebrow">${CONFIG.productName}</span>`}
        <h2 class="heading">${t(step.title)}</h2>
        ${contentHtml}
        <button class="btn-continue">Continuar</button>
      </div>
    `;
    wrap.querySelector('.btn-continue').addEventListener('click', goNext);
  }

  function renderLoading(wrap){
    wrap.innerHTML = `
      <div class="loading-wrap">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52"></circle>
            <circle class="fill" id="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="327" stroke-dashoffset="327"></circle>
          </svg>
          <div class="pct" id="ring-pct">0%</div>
        </div>
        <h2 class="heading" style="font-size:23.5px;">Analisando suas respostas...</h2>
        <p class="sub">Estamos montando o seu diagnóstico personalizado.</p>
      </div>
    `;
    const fill = wrap.querySelector('#ring-fill');
    const pctEl = wrap.querySelector('#ring-pct');
    let pct = 0;
    const timer = setInterval(()=>{
      pct += Math.random()*14 + 6;
      if(pct >= 100){ pct = 100; clearInterval(timer); setTimeout(goNext, 450); }
      fill.style.strokeDashoffset = String(327 - (327*pct/100));
      pctEl.textContent = Math.round(pct) + '%';
    }, 260);
  }

  function renderThankyou(wrap){
    wrap.innerHTML = `
      ${brandHtml()}
      <div class="expert-avatar"><img src="${IMG_HOMEM}" alt="${CONFIG.expertName}" /></div>
      <h2 class="heading">Obrigado pelas suas respostas.</h2>
      <div class="quote-block">
        <p>Eu sou ${CONFIG.expertName}, e estudo relacionamentos há anos.</p>
        <p>${CONFIG.expertBio}</p>
        <p>A partir das suas respostas, montei um caminho de 21 dias com ações simples e na ordem certa pra reconstruir essa conexão, sem joguinho e sem se humilhar.</p>
      </div>
      <button class="btn-continue">Continuar</button>
    `;
    wrap.querySelector('.btn-continue').addEventListener('click', goNext);
  }

  function renderTestimonials(wrap){
    wrap.innerHTML = `
      <div class="stat-hero">
        <div class="num">[XX]%</div>
        <p class="cap">dos alunos relatam progresso já nas primeiras semanas seguindo o método. <em>Substitua pelo seu número real</em>.</p>
      </div>
      <div class="testi-card placeholder">
        <div class="who"><div class="avatar">＋</div><div><div class="name">Nome do cliente</div><div class="meta">Cidade, Estado</div></div></div>
        <p class="quote">"Espaço reservado para um depoimento real de um cliente seu. Substitua este texto antes de publicar."</p>
      </div>
      <div class="testi-card placeholder">
        <div class="who"><div class="avatar">＋</div><div><div class="name">Nome do cliente</div><div class="meta">Cidade, Estado</div></div></div>
        <p class="quote">"Outro espaço para depoimento real. Depoimentos verdadeiros aumentam muito a confiança na sua oferta."</p>
      </div>
      <p class="placeholder-note">⚠ estatística e depoimentos são placeholders, troque por dados reais do seu negócio</p>
      <button class="btn-continue">Continuar</button>
    `;
    wrap.querySelector('.btn-continue').addEventListener('click', goNext);
  }

  function renderProgressLoading(wrap){
    wrap.innerHTML = `
      ${brandHtml()}
      <h2 class="heading" style="font-size:23.5px;">Montando o seu plano personalizado</h2>
      <div class="loading-lines" style="margin-top:30px;">
        <div class="loading-line">
          <div class="row"><span>Carregando suas respostas</span><span class="v1">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar1"></div></div>
        </div>
        <div class="loading-line">
          <div class="row"><span>Cruzando com seu perfil de relacionamento</span><span class="v2">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar2"></div></div>
        </div>
        <div class="loading-line">
          <div class="row"><span>Gerando seu plano de 21 dias</span><span class="v3">0%</span></div>
          <div class="bar-track"><div class="bar-fill" id="bar3"></div></div>
        </div>
      </div>
    `;
    const bars = [
      {el:wrap.querySelector('#bar1'), v:wrap.querySelector('.v1'), delay:0,    dur:1100},
      {el:wrap.querySelector('#bar2'), v:wrap.querySelector('.v2'), delay:900,  dur:1300},
      {el:wrap.querySelector('#bar3'), v:wrap.querySelector('.v3'), delay:2000, dur:1400}
    ];
    bars.forEach(b=>{
      setTimeout(()=>{
        let p = 0;
        const iv = setInterval(()=>{
          p += 100 / (b.dur/60);
          if(p >= 100){ p = 100; clearInterval(iv); }
          b.el.style.width = p + '%';
          b.v.textContent = Math.round(p) + '%';
        }, 60);
      }, b.delay);
    });
    setTimeout(goNext, 3600);
  }

  function renderFinalStep(wrap){
    wrap.innerHTML = `
      ${brandHtml()}
      <h2 class="heading">Seu plano de 21 dias pra reconstruir essa conexão está pronto.</h2>
      <img src="${IMG_GRAFICO}" alt="Linha do tempo: evolução esperada nos 21 dias do plano" style="width:100%;border-radius:var(--radius-md);margin-top:30px;display:block;" />
      <ul class="checklist">
        <li><span class="ck">✓</span> {Ex} volta a pensar em você com mais frequência.</li>
        <li><span class="ck">✓</span> As conversas voltam a fluir sem climão nem cobrança.</li>
        <li><span class="ck">✓</span> Você reconstrói sua autoconfiança pelo caminho, com ou sem volta.</li>
        <li><span class="ck">✓</span> Vocês reabrem espaço pra uma conexão genuína, no tempo certo.</li>
      </ul>
      <h3 class="heading" style="font-size:21.5px;margin-top:34px;">Você está pronto(a) pra começar?</h3>
      <button class="btn-continue">Sim, quero {ex} de volta</button>
    `;
    wrap.querySelector('.btn-continue').innerHTML = t(wrap.querySelector('.btn-continue').textContent);
    wrap.querySelectorAll('.checklist li').forEach(li=> li.innerHTML = t(li.innerHTML));
    wrap.querySelector('.btn-continue').addEventListener('click', goNext);
  }

  function computeProbability(){
    let score = 78;
    const a = state.answers;
    if(a.situacao === 'Conversamos de vez em quando' || a.situacao === 'Viramos amigos') score += 8;
    if(a.situacao === '{Ex} me bloqueou') score -= 6;
    if(a.novo_alguem === 'Não, não está') score += 6;
    if(a.comprometimento === '4') score += 5;
    if(a.comprometimento === '1') score -= 8;
    return Math.max(74, Math.min(96, score));
  }

  function renderLanding(wrap){
    const prob = computeProbability();
    const probLabel = prob >= 90 ? 'Alta' : (prob >= 80 ? 'Boa' : 'Moderada');
    const bonuses = [
      'Plano principal: ' + CONFIG.productName,
      'Bônus #1: Guia de primeiras mensagens',
      'Bônus #2: Script de conversas difíceis',
      'Bônus #3: Checklist de autoestima em 7 dias',
      'Acesso vitalício e atualizações'
    ];
    const faqs = [
      {q:'Por que eu deveria escolher esse método?', a:'Porque ele é estruturado em passos, na ordem certa, em vez de depender de sorte ou de "adivinhar" a próxima atitude.'},
      {q:'Em quanto tempo vejo resultado?', a:'Cada história é diferente, mas o plano é desenhado pra gerar as primeiras mudanças de comportamento dentro das primeiras semanas.'},
      {q:'Preciso de alguma habilidade especial?', a:'Não. O método foi pensado pra ser seguido por qualquer pessoa dedicada, com instruções claras e diretas.'},
      {q:'E se eu perder a motivação no meio do caminho?', a:'O plano inclui lembretes e uma estrutura simples justamente pra te manter no caminho mesmo nos dias mais difíceis.'}
    ];

    wrap.innerHTML = `
      <div class="countdown-bar">
        <span class="cd-text">🔥 Desconto expira em <span class="clock" id="cd">10:00</span></span>
        <a class="cd-cta" href="${CONFIG.checkoutUrl}" target="_blank" rel="noopener">Garantir plano</a>
      </div>

      <div class="lp-hero">
        <span class="eyebrow">Resultado do seu teste</span>
        <h1 class="heading">O plano personalizado pra reconquistar {ex} está pronto</h1>
      </div>

      <div class="lp-section tight">
        <div class="compare-grid">
          <div class="compare-card now">
            <div class="cc-label">Separação emocional</div>
            <div class="cc-bar-track"><div class="cc-bar-fill now"></div></div>
            <div class="cc-title">💔 Alta</div>
            <div class="cc-sub">Vocês terminaram e o contato está travado</div>
          </div>
          <div class="compare-card goal">
            <div class="cc-label">Separação emocional</div>
            <div class="cc-bar-track"><div class="cc-bar-fill goal"></div></div>
            <div class="cc-title">💚 Baixa</div>
            <div class="cc-sub">Reconquistar {ex}</div>
          </div>
        </div>

        <div class="prob-card">
          <div class="prob-num">${prob}%</div>
          <div class="prob-text">
            <div class="prob-label">Probabilidade de sucesso (${probLabel})</div>
            <div class="cc-bar-track"><div class="cc-bar-fill prob" style="width:${prob}%"></div></div>
            <p>Calculada com base nas suas respostas ao teste. <span style="opacity:.7">(estimativa ilustrativa, não é uma garantia)</span></p>
          </div>
        </div>

        <div class="urgency-line"><span class="ico">⚠️</span><span>Hora de agir: <strong>urgente</strong>. Com base no seu perfil, cada semana de hesitação reduz suas chances de reconquistar {ex}.</span></div>
      </div>

      <div class="method-name">
        <span class="eyebrow">O seu plano personalizado é o</span>
        <h2>${CONFIG.productName}</h2>
        <p class="method-lede">Um passo a passo direto, sem joguinho mental e sem depender de sorte, pra reconstruir essa conexão do jeito certo.</p>
      </div>

      <div class="lp-section" style="padding-top:0;">
        <div class="price-card">
          <span class="offer-tag">Oferta especial</span>
          <ul class="bonus-list">
            ${bonuses.map(b=>`<li><span class="ck">✓</span>${b}</li>`).join('')}
          </ul>
          <div class="price-row">
            <span class="old">${CONFIG.currency}${CONFIG.priceOld}</span>
            <span class="new">${CONFIG.currency}${CONFIG.priceNew}</span>
          </div>
          <p class="price-note">Pagamento único · acesso imediato</p>
          <a class="btn-buy" href="${CONFIG.checkoutUrl}" target="_blank" rel="noopener">Quero meu plano agora</a>
          <p class="secure-note">Pagamento processado por ambiente seguro</p>
        </div>

        <div class="stats-row">
          <div><div class="n">[XX]%</div><div class="l">seguem o plano até o fim</div></div>
          <div><div class="n">[XX]%</div><div class="l">relatam mudança no relacionamento</div></div>
          <div><div class="n">[XX]%</div><div class="l">notam mais autoconfiança</div></div>
        </div>
        <p class="placeholder-note">⚠ números acima são placeholders, troque por estatísticas reais do seu negócio</p>

        <div style="margin-top:44px;">
          <h3 class="heading" style="font-size:23.5px;">O que dizem sobre o método</h3>
          <div class="testi-card placeholder">
            <div class="who"><div class="avatar">＋</div><div><div class="name">Nome do cliente</div><div class="meta">Cidade, Estado</div></div></div>
            <p class="quote">"Espaço para um depoimento real. Textos de clientes verdadeiros convertem muito mais do que exemplos genéricos."</p>
          </div>
          <div class="testi-card placeholder">
            <div class="who"><div class="avatar">＋</div><div><div class="name">Nome do cliente</div><div class="meta">Cidade, Estado</div></div></div>
            <p class="quote">"Outro espaço reservado. Troque pelos depoimentos reais dos seus alunos antes de publicar os anúncios."</p>
          </div>
        </div>

        <div class="guarantee">
          <div class="badge"><div class="n">30</div><div class="d">DIAS</div></div>
          <p>Garantia de 30 dias: se você seguir o plano à risca e não perceber nenhuma mudança positiva, devolvemos 100% do valor.</p>
        </div>

        <div style="margin-top:44px;">
          <h3 class="heading" style="font-size:23.5px;">Perguntas frequentes</h3>
          <div id="faq-list">
            ${faqs.map((f,i)=>`
              <div class="faq-item" data-i="${i}">
                <div class="q"><span>${f.q}</span><span class="plus">+</span></div>
                <div class="a"><p>${f.a}</p></div>
              </div>`).join('')}
          </div>
        </div>

        <a class="btn-buy" style="margin-top:40px;" href="${CONFIG.checkoutUrl}" target="_blank" rel="noopener">Garantir meu plano agora</a>
        <div class="footer-space"></div>
      </div>
    `;

    // pronoun substitution for the static {ex} tokens above
    wrap.querySelectorAll('h1, .cc-sub, .urgency-line, .btn-buy').forEach(el=> el.innerHTML = t(el.innerHTML));

    // countdown
    let secondsLeft = CONFIG.countdownMinutes * 60;
    const cdEl = wrap.querySelector('#cd');
    const cdTimer = setInterval(()=>{
      secondsLeft--;
      if(secondsLeft <= 0){ secondsLeft = CONFIG.countdownMinutes * 60; }
      const m = String(Math.floor(secondsLeft/60)).padStart(2,'0');
      const s = String(secondsLeft%60).padStart(2,'0');
      if(cdEl) cdEl.textContent = `${m}:${s}`; else clearInterval(cdTimer);
    }, 1000);

    // faq accordion
    wrap.querySelectorAll('.faq-item').forEach(item=>{
      item.querySelector('.q').addEventListener('click', ()=>{
        const isOpen = item.classList.contains('open');
        wrap.querySelectorAll('.faq-item').forEach(i=>{ i.classList.remove('open'); i.querySelector('.a').style.maxHeight = null; });
        if(!isOpen){ item.classList.add('open'); const a = item.querySelector('.a'); a.style.maxHeight = a.scrollHeight + 'px'; }
      });
    });
  }

  render();
})();
</script>
